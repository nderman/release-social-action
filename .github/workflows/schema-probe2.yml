name: Schema probe 2
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          Q='{"query":"query{__schema{types{name kind inputFields{name type{kind name ofType{kind name}}}fields{name type{kind name ofType{kind name}}args{name type{kind name ofType{kind name}}}}}}}"}'
          curl -sS -X POST https://api.buffer.com/graphql -H "Authorization: Bearer $BUFFER_API_KEY" -H "Content-Type: application/json" -d "$Q" > /tmp/s2.json
          echo "=== CreatePostInput all fields ==="
          jq -c '.data.__schema.types[]|select(.name=="CreatePostInput").inputFields[]|{n:.name,t:(.type.name//.type.ofType.name)}' /tmp/s2.json
          echo "=== posts query args + input type name ==="
          jq -c '.data.__schema.types[]|select(.name=="Query").fields[]|select(.name=="posts")|{args:[.args[]|{n:.name,t:(.type.name//.type.ofType.name)}],ret:(.type.name//.type.ofType.name)}' /tmp/s2.json
          echo "=== channel query args ==="
          jq -c '.data.__schema.types[]|select(.name=="Query").fields[]|select(.name=="channel")|{args:[.args[]|{n:.name,t:(.type.name//.type.ofType.name)}],ret:(.type.name//.type.ofType.name)}' /tmp/s2.json
          echo "=== input object shapes (PostsInput / ChannelInput / *PostsInput*) ==="
          jq -c '.data.__schema.types[]|select(.kind=="INPUT_OBJECT" and (.name|test("Posts|ChannelInput|PostInput$";"i")))|{name,fields:[.inputFields[]|{n:.name,t:(.type.name//.type.ofType.name)}]}' /tmp/s2.json
          echo "=== Channel.service type ==="
          jq -c '.data.__schema.types[]|select(.name=="Channel").fields[]|select(.name=="service")|{t:(.type.name//.type.ofType.name)}' /tmp/s2.json
          echo "=== Post type fields ==="
          jq -c '.data.__schema.types[]|select(.name=="Post").fields[]|{n:.name,t:(.type.name//.type.ofType.name)}' /tmp/s2.json
