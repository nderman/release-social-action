# Throwaway: introspect Buffer's GraphQL schema to design features against
# ground truth (createPost input, scheduling enums, Channel.service, posts query).
# Manual-only. Safe to delete after use.
name: Schema probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Introspect Buffer schema
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          Q='{"query":"query{__schema{queryType{name}mutationType{name}types{name kind enumValues{name}inputFields{name type{kind name ofType{kind name ofType{kind name}}}}fields{name args{name type{kind name ofType{kind name}}}type{kind name ofType{kind name}}}}}}"}'
          curl -sS -X POST https://api.buffer.com/graphql \
            -H "Authorization: Bearer $BUFFER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$Q" > /tmp/schema.json

          echo "=== top-level errors (if introspection disabled) ==="
          jq -c '.errors // "none"' /tmp/schema.json

          echo "=== Query type fields (look for posts/channels) ==="
          QN=$(jq -r '.data.__schema.queryType.name // "Query"' /tmp/schema.json)
          jq --arg QN "$QN" '.data.__schema.types[] | select(.name==$QN) | .fields[] | {name, args: [.args[].name]}' /tmp/schema.json

          echo "=== CreatePostInput input fields (types matter) ==="
          jq '.data.__schema.types[] | select(.name=="CreatePostInput") | .inputFields[] | {name, kind: .type.kind, type: .type.name, of: .type.ofType.name, of2: .type.ofType.ofType.name}' /tmp/schema.json

          echo "=== Channel type fields (look for service) ==="
          jq '.data.__schema.types[] | select(.name=="Channel") | .fields[] | {name, type: (.type.name // .type.ofType.name)}' /tmp/schema.json

          echo "=== Enums (scheduling mode / type) ==="
          jq -c '.data.__schema.types[] | select(.kind=="ENUM" and (.enumValues|length>0) and (.name|test("Mode|Schedul|Post|Channel";"i"))) | {name, values: [.enumValues[].name]}' /tmp/schema.json

          echo "=== Mutation fields ==="
          jq -c '.data.__schema.types[] | select(.name=="Mutation") | .fields[].name' /tmp/schema.json
