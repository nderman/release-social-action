name: Schema probe 3
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          Q='{"query":"query{__schema{types{name kind enumValues{name}inputFields{name type{kind name ofType{kind name}}}fields{name type{kind name ofType{kind name ofType{kind name}}}}}}}"}'
          curl -sS -X POST https://api.buffer.com/graphql -H "Authorization: Bearer $BUFFER_API_KEY" -H "Content-Type: application/json" -d "$Q" > /tmp/s3.json
          echo "=== PostsResults fields ==="
          jq -c '.data.__schema.types[]|select(.name=="PostsResults").fields[]|{n:.name,t:(.type.name//.type.ofType.name//.type.ofType.ofType.name)}' /tmp/s3.json
          echo "=== PostsInput nullability ==="
          jq -c '.data.__schema.types[]|select(.name=="PostsInput").inputFields[]|{n:.name,kind:.type.kind,t:(.type.name//.type.ofType.name)}' /tmp/s3.json
          echo "=== any *Edge or *Connection for posts ==="
          jq -c '.data.__schema.types[]|select(.name|test("PostEdge|PostsResults|PostConnection"))|{name,fields:[.fields[]?.name]}' /tmp/s3.json
          echo "=== Service enum values ==="
          jq -c '.data.__schema.types[]|select(.name=="Service")|{kind,values:[.enumValues[]?.name]}' /tmp/s3.json
